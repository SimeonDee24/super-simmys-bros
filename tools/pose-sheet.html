<!doctype html>
<!-- Art helper: open /tools/pose-sheet.html on the local server to see every
     animation key pose and palette of a character, enlarged. -->
<html><head><meta charset="utf-8"><title>Pose sheet</title>
<style>body{background:#7fa6d8;margin:8px;font:12px monospace}canvas{image-rendering:pixelated;width:1440px;height:auto;display:block}</style>
</head><body><canvas id="c" width="480" height="560"></canvas>
<script type="module">
import { CHARACTERS } from '../characters/index.js';
import { DollRenderer } from '../render/doll.js';
import { drawText } from '../render/font.js';
const ch = CHARACTERS[new URLSearchParams(location.search).get('i') | 0];
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const doll = new DollRenderer();
let x = 30, y = 64;
for (const [name, a] of Object.entries(ch.animations)) {
  drawText(ctx, name, x - 12, y + 4, '#fff', 1, 'left', '#000');
  for (const k of a.keys) {
    doll.draw(ctx, ch, 0, k.pose, x, y, 1);
    ctx.fillStyle = '#0006'; ctx.fillRect(x - 10, y, 20, 1);
    x += 34;
    if (x > 450) { x = 30; y += 66; }
  }
  x += 8;
  if (x > 430) { x = 30; y += 66; }
}
x = 30; y += 70;
ch.palettes.forEach((p, i) => { doll.drawAnim(ctx, ch, i, 'idle', 0, x, y, i % 2 ? -1 : 1); drawText(ctx, p.name, x, y + 4, '#fff', 1, 'center', '#000'); x += 40; });
window.__done = true;
</script></body></html>
