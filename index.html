<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Simmy's Bros</title>
<link rel="icon" href="data:,">
<script>
// Boot loader. Reads version.json (never cached), then loads the stylesheet,
// main.js and every module with ?v=<version>, so players always get one
// consistent, current set of files after an update.
(async () => {
  let info = { version: 'dev', modules: [] };
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    info = await r.json();
  } catch (e) { /* offline or missing: fall back to un-versioned files */ }
  const v = encodeURIComponent(info.version);

  const css = document.createElement('link');
  css.rel = 'stylesheet';
  css.href = 'style.css?v=' + v;
  document.head.appendChild(css);

  const imports = {};
  for (const m of info.modules || []) imports['./' + m] = './' + m + '?v=' + v;
  const map = document.createElement('script');
  map.type = 'importmap';
  map.textContent = JSON.stringify({ imports });
  document.head.appendChild(map);

  const main = document.createElement('script');
  main.type = 'module';
  main.src = 'main.js?v=' + v;
  main.onerror = () => {
    const el = document.getElementById('boot-error');
    el.style.display = 'block';
    el.textContent = 'Could not load the game. Open it through a web server (see README), not as a file.';
  };
  document.head.appendChild(main);
})();
</script>
</head>
<body>
<canvas id="game" width="480" height="270"></canvas>
<div id="boot-error"></div>
</body>
</html>
